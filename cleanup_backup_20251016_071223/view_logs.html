<!DOCTYPE html>
<html>
<head>
    <title>Agent Logs Viewer</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        .log-entry {
            background: #252526;
            border-left: 4px solid #007acc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .log-entry.success {
            border-left-color: #4ec9b0;
        }
        .log-entry.error {
            border-left-color: #f48771;
        }
        .log-entry.warning {
            border-left-color: #dcdcaa;
        }
        .timestamp {
            color: #858585;
            font-size: 0.9em;
        }
        .agent-step {
            color: #4ec9b0;
            font-weight: bold;
            font-size: 1.1em;
            margin: 10px 0;
        }
        .separator {
            border-top: 2px solid #007acc;
            margin: 20px 0;
        }
        .metric {
            display: inline-block;
            background: #007acc;
            color: white;
            padding: 4px 10px;
            border-radius: 3px;
            margin: 5px 5px 5px 0;
            font-size: 0.9em;
        }
        .button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 5px;
        }
        .button:hover {
            background: #005a9e;
        }
        #status {
            padding: 10px;
            background: #252526;
            border-radius: 4px;
            margin: 10px 0;
        }
        .loading {
            color: #dcdcaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Agent Logs Viewer</h1>
        
        <div id="status" class="loading">
            Click "Load Logs" to fetch recent agent executions...
        </div>
        
        <div>
            <button class="button" onclick="loadLogs()">🔄 Load Recent Logs</button>
            <button class="button" onclick="loadLiveLogs()">▶️ Watch Live (Auto-refresh)</button>
            <button class="button" onclick="stopLive()">⏸️ Stop Live</button>
            <button class="button" onclick="clearLogs()">🗑️ Clear</button>
        </div>
        
        <div id="logs"></div>
    </div>

    <script>
        let liveInterval = null;

        async function loadLogs() {
            document.getElementById('status').innerHTML = '⏳ Loading logs...';
            document.getElementById('status').className = 'loading';
            
            try {
                // Note: This won't work directly from browser due to CORS
                // You need to run the shell script and copy output
                document.getElementById('status').innerHTML = `
                    <strong>📋 To view logs:</strong><br><br>
                    <strong>Option 1: Run in Terminal</strong><br>
                    <code>./view_agent_logs.sh</code><br><br>
                    
                    <strong>Option 2: GCP Console (Easiest)</strong><br>
                    <a href="https://console.cloud.google.com/run/detail/us-central1/unschooling-backend/logs?project=unschooling-464413" 
                       target="_blank" 
                       style="color: #4ec9b0;">
                        → Open Agent Logs in GCP Console
                    </a><br><br>
                    
                    <strong>Option 3: Create Simple Export</strong><br>
                    Run this command to save logs to file:<br>
                    <code>./export_logs.sh</code>
                `;
                
                // Show sample log
                showSampleLog();
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
            }
        }

        function showSampleLog() {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = `
                <div class="separator"></div>
                <div class="agent-step">🚀 PLAN GENERATION - 11:29:23 PM IST</div>
                
                <div class="log-entry">
                    <div class="timestamp">Step 1 - 11:29:23 PM</div>
                    <div class="agent-step">📝 PROFILE AGENT</div>
                    <div>Input: Child "ilo", age 6</div>
                    <div>Interests: Entrepreneurship, Communication, Design Thinking</div>
                    <div class="metric">✅ Completed in 0.00s</div>
                </div>

                <div class="log-entry">
                    <div class="timestamp">Step 2 - 11:29:23 PM</div>
                    <div class="agent-step">🎯 MATCH AGENT</div>
                    <div>Searching: 400+ topics</div>
                    <div>Matched: 28 topics</div>
                    <div>Topics: Finance, Communication</div>
                    <div class="metric">✅ Completed in 0.00s</div>
                </div>

                <div class="log-entry">
                    <div class="timestamp">Step 3 - 11:29:23 PM</div>
                    <div class="agent-step">📅 SCHEDULE AGENT</div>
                    <div>Input: 28 topics</div>
                    <div>Output: 4-week plan</div>
                    <div class="metric">✅ Completed in 0.00s</div>
                </div>

                <div class="log-entry success">
                    <div class="timestamp">Step 4 - 11:29:23 PM</div>
                    <div class="agent-step">✅ REVIEWER AGENT</div>
                    <div>Plan validated successfully</div>
                    <div class="metric">✅ Completed in 0.00s</div>
                </div>

                <div class="log-entry success">
                    <div class="timestamp">Result - 11:29:23 PM</div>
                    <div class="agent-step">🎉 SUCCESS</div>
                    <div>Status: 200 OK</div>
                    <div>All 4 agents completed successfully</div>
                </div>

                <div class="separator"></div>
                <p style="color: #858585; font-size: 0.9em;">
                    ℹ️  This is your most recent plan generation from 11:29 PM.
                    To see live logs, use the GCP Console link above.
                </p>
            `;
        }

        function loadLiveLogs() {
            alert('Live logging works best in GCP Console.\n\nClick the "GCP Console" link above to see real-time logs.');
        }

        function stopLive() {
            if (liveInterval) {
                clearInterval(liveInterval);
                liveInterval = null;
                document.getElementById('status').innerHTML = '⏸️ Live updates stopped';
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            document.getElementById('status').innerHTML = 'Logs cleared. Click "Load Recent Logs" to reload.';
        }

        // Auto-load on page load
        window.onload = () => loadLogs();
    </script>
</body>
</html>
