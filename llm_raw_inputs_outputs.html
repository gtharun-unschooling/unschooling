<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Raw Inputs & Outputs</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0}
body {
  font-family: 'Courier New', monospace;
  background: #1e1e1e;
  color: #d4d4d4;
  padding: 20px;
  line-height: 1.6;
}
.container {
  max-width: 1600px;
  margin: 0 auto;
  background: #252526;
  border-radius: 8px;
  padding: 30px;
}
h1 {
  color: #4ec9b0;
  font-size: 1.8em;
  margin-bottom: 30px;
  text-align: center;
  border-bottom: 2px solid #4ec9b0;
  padding-bottom: 15px;
}
.agent-section {
  background: #1e1e1e;
  border: 1px solid #3e3e42;
  border-radius: 6px;
  padding: 25px;
  margin: 25px 0;
}
.agent-title {
  color: #4ec9b0;
  font-size: 1.4em;
  margin-bottom: 20px;
  font-weight: bold;
}
.io-block {
  margin: 20px 0;
}
.io-label {
  color: #dcdcaa;
  font-size: 1.1em;
  font-weight: bold;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.io-content {
  background: #000;
  border: 1px solid #3e3e42;
  border-radius: 4px;
  padding: 20px;
  color: #d4d4d4;
  overflow-x: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.6;
  max-height: 600px;
  overflow-y: auto;
}
.status {
  color: #4ec9b0;
  font-weight: bold;
  margin: 10px 0;
}
.btn {
  background: #0e639c;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 4px;
  cursor: pointer;
  margin: 10px 5px;
  font-size: 1em;
  font-family: 'Courier New', monospace;
}
.btn:hover {
  background: #1177bb;
}
</style>
</head>
<body>
<div class="container">
<h1>🤖 RAW LLM INPUTS & OUTPUTS - EACH AGENT</h1>

<div style="text-align: center; margin-bottom: 30px;">
<button class="btn" onclick="loadPlan()">🔄 LOAD LATEST PLAN</button>
<button class="btn" onclick="copyAllOutputs()">📋 COPY ALL OUTPUTS</button>
</div>

<div id="content">
<div style="text-align: center; padding: 40px; color: #4ec9b0; font-size: 1.2em">
Click "LOAD LATEST PLAN" to view raw LLM inputs and outputs
</div>
</div>

</div>

<script>
let allData = null;

async function loadPlan() {
  try {
    document.getElementById('content').innerHTML = '<div style="text-align: center; padding: 40px; color: #4ec9b0">⏳ Loading...</div>';
    
    const response = await fetch('latest_llm_plan.json');
    if (!response.ok) throw new Error('Could not load plan file');
    
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Plan generation failed');
    
    allData = result.data;
    displayRawIO(allData);
    
  } catch (error) {
    document.getElementById('content').innerHTML = `
      <div style="color: #f48771; padding: 30px; text-align: center">
        ❌ ERROR: ${error.message}<br><br>
        Make sure latest_llm_plan.json exists in the project root.
      </div>
    `;
  }
}

function displayRawIO(data) {
  const structure = data.monthly_plan_structure || {};
  const agenda = structure.monthly_agenda || {};
  const theme = structure.selected_themes?.[0] || {};
  
  let html = '';
  
  html += `<div class="status">📊 Plan Type: ${data.standardized_profile?.plan_type || 'N/A'}</div>`;
  html += `<div class="status">👶 Child: ${data.standardized_profile?.child_name || 'N/A'} (Age: ${data.standardized_profile?.child_age || 'N/A'})</div>`;
  html += `<div class="status">🎯 Interests: ${(data.standardized_profile?.interests || []).join(', ') || 'None'}</div>`;
  html += '<hr style="border-color: #3e3e42; margin: 20px 0">';
  
  // ====== AGENT 1: ANALYSIS AGENT ======
  html += `
    <div class="agent-section">
      <div class="agent-title">📝 AGENT 1: ANALYSIS AGENT (Theme Selection)</div>
      
      <div class="io-block">
        <div class="io-label">📥 LLM INPUT (Prompt):</div>
        <div class="io-content">The prompt for theme selection is generated internally based on:
- Available themes: 240 themes filtered by age (${data.standardized_profile?.child_age}) and plan type
- Child interests: ${(data.standardized_profile?.interests || []).join(', ') || 'None specified'}
- Learning style: ${data.standardized_profile?.preferred_learning_style || 'N/A'}

The LLM receives ~20 candidate themes and selects the best one.</div>
      </div>
      
      <div class="io-block">
        <div class="io-label">📤 LLM OUTPUT (Response):</div>
        <div class="io-content"><strong>Selected Theme:</strong> ${theme.themeName || 'N/A'}

<strong>Theme Description:</strong> ${theme.shortDescription || 'N/A'}

<strong>Core Focus Area:</strong> ${theme.coreFocusArea || 'N/A'}

<strong>AI Thought Process (Why This Theme):</strong>
${agenda.thought_process || 'Not available - fallback used'}

<strong>AI Learning Narrative (What Child Will Experience):</strong>
${agenda.learning_narrative || 'Not available - fallback used'}

<strong>Primary Goal:</strong>
${agenda.primary_goal || 'Not available - fallback used'}</div>
      </div>
    </div>
  `;
  
  // ====== AGENT 2: MATCH AGENT ======
  const matchAnalysis = data.match_analysis || {};
  const guidance = structure.guidance_for_match_agent || {};
  
  html += `
    <div class="agent-section">
      <div class="agent-title">🎯 AGENT 2: MATCH AGENT (Topic Selection)</div>
      
      <div class="io-block">
        <div class="io-label">📥 LLM INPUT (What LLM Receives):</div>
        <div class="io-content">The LLM receives:
- Theme: ${theme.themeName || 'N/A'}
- Topic Criteria: ${guidance.topic_criteria || 'N/A'}
- Available Niche Topics: ~280 topics (filtered by age)
- Available Essential Growth Activities: ~720 activities (filtered by age)
- Child Profile: Age ${data.standardized_profile?.child_age}, Interests: ${(data.standardized_profile?.interests || []).join(', ') || 'None'}

Task: Select 30 niche topics + 20 essential growth activities that match the theme and interests</div>
      </div>
      
      <div class="io-block">
        <div class="io-label">📤 LLM OUTPUT (Selected Topics):</div>
        <div class="io-content"><strong>Total Topics Selected:</strong> ${matchAnalysis.total_topics_selected || 'N/A'}

<strong>Niches Covered:</strong> ${(matchAnalysis.niches_covered || []).join(', ')}

<strong>Topic Criteria (AI-Generated):</strong>
${guidance.topic_criteria || 'Not available - fallback used'}

<strong>Skill Focus (AI-Identified):</strong>
${(guidance.skill_focus || []).map((s, i) => `${i+1}. ${s}`).join('\n') || 'Not available - fallback used'}

<strong>Selection Criteria Met:</strong>
${JSON.stringify(matchAnalysis.selection_criteria || {}, null, 2)}</div>
      </div>
    </div>
  `;
  
  // ====== AGENT 3: SCHEDULE AGENT ======
  const weeklyProg = structure.weekly_progression || {};
  const scheduleGuidance = structure.guidance_for_schedule_agent || {};
  
  html += `
    <div class="agent-section">
      <div class="agent-title">📅 AGENT 3: SCHEDULE AGENT (Week Organization)</div>
      
      <div class="io-block">
        <div class="io-label">📥 LLM INPUT:</div>
        <div class="io-content">The LLM receives:
- 50 candidate topics (30 niche + 20 essential growth)
- Theme: ${theme.themeName || 'N/A'}
- Plan Type: ${data.standardized_profile?.plan_type || 'N/A'}
- Structure Type: ${scheduleGuidance.structure_type || 'N/A'}
- Daily Balance Guidance: ${scheduleGuidance.daily_balance || 'N/A'}

Task: Select final 28 topics and organize into 4 themed weeks with progression</div>
      </div>
      
      <div class="io-block">
        <div class="io-label">📤 LLM OUTPUT (Week-by-Week Organization):</div>
        <div class="io-content">`;
  
  for (let [weekKey, weekDesc] of Object.entries(weeklyProg)) {
    const weekNum = weekKey.replace('week_', '');
    html += `
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
WEEK ${weekNum}:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${weekDesc}

`;
  }
  
  html += `</div></div></div>`;
  
  // ====== AGENT 4: REVIEWER AGENT ======
  const review = data.review || {};
  
  html += `
    <div class="agent-section">
      <div class="agent-title">✅ AGENT 4: REVIEWER AGENT (Quality Assessment)</div>
      
      <div class="io-block">
        <div class="io-label">📥 LLM INPUT:</div>
        <div class="io-content">The LLM receives:
- Complete 4-week plan with all activities
- Child profile (age, interests, learning style)
- Matched topics count
- Theme information

Task: Comprehensive quality review of the entire plan</div>
      </div>
      
      <div class="io-block">
        <div class="io-label">📤 LLM OUTPUT (Quality Assessment):</div>
        <div class="io-content">`;
  
  if (review.review_summary) {
    html += `<strong>Review Summary:</strong>
${review.review_summary}

<strong>Complete Review Data:</strong>
${JSON.stringify(review, null, 2)}`;
  } else {
    html += `⚠️ Reviewer output not available - using fallback

Fallback review data:
${JSON.stringify(review, null, 2)}`;
  }
  
  html += `</div></div></div>`;
  
  // ====== LLM STATUS ======
  const hasNarrative = (agenda.learning_narrative || '').length > 100;
  const hasThought = (agenda.thought_process || '').length > 100;
  const llmWorking = hasNarrative && hasThought;
  
  html += `
    <div class="agent-section" style="background: ${llmWorking ? '#0d3d0d' : '#3d0d0d'}">
      <div class="agent-title" style="color: ${llmWorking ? '#4ec9b0' : '#f48771'}">
        ${llmWorking ? '✅ LLM STATUS: WORKING' : '⚠️ LLM STATUS: USING FALLBACK'}
      </div>
      <div class="io-content">
AI Narrative Present: ${hasNarrative ? 'YES ✅' : 'NO ❌'}
AI Thought Process Present: ${hasThought ? 'YES ✅' : 'NO ❌'}
Theme Selected: ${theme.themeName || 'N/A'}

${llmWorking ? 
  '✅ This plan was generated with full AI intelligence!' : 
  '⚠️ This plan used fallback logic - LLM may not be fully active'}
      </div>
    </div>
  `;
  
  document.getElementById('content').innerHTML = html;
}

function copyAllOutputs() {
  if (!allData) {
    alert('Load a plan first');
    return;
  }
  
  const structure = allData.monthly_plan_structure || {};
  const agenda = structure.monthly_agenda || {};
  const theme = structure.selected_themes?.[0] || {};
  const weeklyProg = structure.weekly_progression || {};
  const review = allData.review || {};
  const guidance = structure.guidance_for_match_agent || {};
  
  let text = '═══════════════════════════════════════════════════════════\n';
  text += 'LLM INPUTS & OUTPUTS - ALL AGENTS\n';
  text += '═══════════════════════════════════════════════════════════\n\n';
  
  text += '───────────────────────────────────────────────────────────\n';
  text += 'AGENT 1: ANALYSIS AGENT (Theme Selection)\n';
  text += '───────────────────────────────────────────────────────────\n\n';
  text += 'OUTPUT:\n';
  text += `Selected Theme: ${theme.themeName || 'N/A'}\n\n`;
  text += `AI Thought Process:\n${agenda.thought_process || 'Not available'}\n\n`;
  text += `AI Learning Narrative:\n${agenda.learning_narrative || 'Not available'}\n\n`;
  text += `Primary Goal:\n${agenda.primary_goal || 'Not available'}\n\n`;
  
  text += '───────────────────────────────────────────────────────────\n';
  text += 'AGENT 2: MATCH AGENT (Topic Selection)\n';
  text += '───────────────────────────────────────────────────────────\n\n';
  text += 'OUTPUT:\n';
  text += `Topic Criteria:\n${guidance.topic_criteria || 'Not available'}\n\n`;
  text += `Skill Focus:\n${(guidance.skill_focus || []).join('\n') || 'Not available'}\n\n`;
  
  text += '───────────────────────────────────────────────────────────\n';
  text += 'AGENT 3: SCHEDULE AGENT (Week Organization)\n';
  text += '───────────────────────────────────────────────────────────\n\n';
  text += 'OUTPUT:\n';
  for (let [week, desc] of Object.entries(weeklyProg)) {
    text += `\n${week.toUpperCase()}:\n${desc}\n`;
  }
  
  text += '\n───────────────────────────────────────────────────────────\n';
  text += 'AGENT 4: REVIEWER AGENT (Quality Assessment)\n';
  text += '───────────────────────────────────────────────────────────\n\n';
  text += 'OUTPUT:\n';
  text += JSON.stringify(review, null, 2);
  text += '\n\n';
  
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ All LLM outputs copied to clipboard!');
  }).catch(() => {
    alert('❌ Could not copy to clipboard');
  });
}

// Auto-load on page load
window.addEventListener('load', loadPlan);
</script>
</body>
</html>
