<!DOCTYPE html>
<html>
<head>
<title>Live Latest Customer Plan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
.container{max-width:1600px;margin:0 auto;background:#fff;border-radius:20px;padding:40px;color:#333}
h1{color:#667eea;margin-bottom:10px;font-size:2.5em}
.subtitle{color:#999;margin-bottom:30px}
.customer-info{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:30px;border-radius:15px;margin-bottom:30px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:20px}
.info-item{background:rgba(255,255,255,0.15);padding:20px;border-radius:10px;text-align:center}
.info-label{font-size:0.85em;opacity:0.9;margin-bottom:10px}
.info-value{font-size:1.8em;font-weight:700}
.tabs{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.tab{background:#e0e0e0;border:none;color:#333;padding:15px 25px;border-radius:10px 10px 0 0;cursor:pointer;font-size:15px;font-weight:600;transition:all 0.3s}
.tab:hover{background:#d0d0d0}
.tab.active{background:#667eea;color:#fff}
.tab-content{display:none;background:#f8f9fa;border-radius:0 10px 10px 10px;padding:30px;min-height:500px}
.tab-content.active{display:block}
.json-viewer{background:#2d2d2d;color:#f8f8f2;padding:20px;border-radius:10px;overflow:auto;max-height:700px}
pre{margin:0;font-family:'Monaco','Courier New',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.btn{background:#667eea;color:#fff;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;margin:10px 5px 20px 0;font-size:15px;font-weight:600}
.btn:hover{background:#5568d3}
.section{margin:30px 0}
.section h3{color:#667eea;margin:0 0 15px;font-size:1.3em}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin:20px 0}
.io-box{background:#fff;border:2px solid #e0e0e0;padding:20px;border-radius:10px}
.io-box h4{color:#999;margin:0 0 15px;font-size:1em;text-transform:uppercase;letter-spacing:1px}
.status{padding:8px 20px;border-radius:20px;font-weight:600;display:inline-block;margin-left:15px}
.status.success{background:#4caf50;color:#fff}
.status.loading{background:#ff9800;color:#fff}
.status.error{background:#f44336;color:#fff}
.metric{display:inline-block;background:#e3f2fd;color:#1976d2;padding:8px 16px;border-radius:20px;margin:5px;font-weight:600}
.loading{text-align:center;padding:50px;font-size:1.5em;color:#667eea}
.error{text-align:center;padding:50px;font-size:1.2em;color:#f44336}
.week-block{background:#fff;border:2px solid #e0e0e0;border-radius:10px;padding:20px;margin-bottom:20px}
.week-header{color:#667eea;font-size:1.5em;margin-bottom:15px;font-weight:700}
.topic-card{background:#f8f9fa;border-left:4px solid #667eea;padding:15px;margin:10px 0;border-radius:5px}
.topic-title{font-weight:600;color:#333;margin-bottom:5px}
.topic-meta{font-size:0.9em;color:#666}
</style>
</head>
<body>
<div class="container">
<h1>📊 Live Latest Customer Plan</h1>
<div class="subtitle" id="lastUpdated">
Loading latest data...
</div>

<button class="btn" onclick="loadLatestPlan()">🔄 Refresh Now</button>
<button class="btn" onclick="copyAllData()">📋 Copy All JSON</button>
<button class="btn" onclick="toggleAutoRefresh()">⏱️ Auto-Refresh: <span id="autoRefreshStatus">OFF</span></button>

<div id="content">
<div class="loading">🔄 Loading latest customer plan from Firebase...</div>
</div>

</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBX2bZmOUosU-2PXZFQVN_WLLuee_zkFzI",
  authDomain: "unschooling-464413.firebaseapp.com",
  projectId: "unschooling-464413",
  storageBucket: "unschooling-464413.appspot.com",
  messagingSenderId: "790275794964",
  appId: "1:790275794964:web:f981a7f0693cc186631f01"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let latestData = null;
let autoRefreshInterval = null;

// Load latest plan
async function loadLatestPlan() {
  try {
    console.log('🔍 Fetching latest customer plan...');
    
    // Get all users
    const usersSnapshot = await getDocs(collection(db, 'users'));
    
    if (usersSnapshot.empty) {
      showError('No users found in database');
      return;
    }

    let allPlans = [];
    
    // Iterate through each user to find their children and plans
    for (const userDoc of usersSnapshot.docs) {
      const userId = userDoc.id;
      const userData = userDoc.data();
      
      // Get children for this user
      const childrenSnapshot = await getDocs(collection(db, `users/${userId}/children`));
      
      for (const childDoc of childrenSnapshot.docs) {
        const childId = childDoc.id;
        const childData = childDoc.data();
        
        // Get plans for this child
        const plansSnapshot = await getDocs(
          query(
            collection(db, `users/${userId}/children/${childId}/plans`),
            orderBy('created_at', 'desc'),
            limit(1)
          )
        );
        
        plansSnapshot.forEach(planDoc => {
          const planData = planDoc.data();
          allPlans.push({
            planId: planDoc.id,
            userId: userId,
            userEmail: userData.email || 'N/A',
            userName: userData.displayName || userData.name || 'N/A',
            childId: childId,
            childName: childData.child_name || childData.name || 'N/A',
            childAge: childData.child_age || childData.age || 'N/A',
            interests: childData.interests || [],
            planData: planData,
            createdAt: planData.created_at?.toDate() || new Date()
          });
        });
      }
    }
    
    if (allPlans.length === 0) {
      showError('No plans found in database. Create a child profile and generate a plan first.');
      return;
    }
    
    // Sort by creation time and get the latest
    allPlans.sort((a, b) => b.createdAt - a.createdAt);
    const latestPlan = allPlans[0];
    
    latestData = latestPlan;
    displayPlan(latestPlan);
    
    console.log('✅ Latest plan loaded successfully', latestPlan);
    
  } catch (error) {
    console.error('❌ Error loading plan:', error);
    showError('Error loading data: ' + error.message);
  }
}

function displayPlan(plan) {
  const now = new Date();
  const timeStr = now.toLocaleString('en-IN', { 
    timeZone: 'Asia/Kolkata',
    dateStyle: 'long',
    timeStyle: 'medium'
  });
  
  document.getElementById('lastUpdated').textContent = `Last Updated: ${timeStr}`;
  
  const planData = plan.planData;
  const schedule = planData.schedule || planData.final_schedule || {};
  const weeks = schedule.weeks || [];
  const totalTopics = weeks.reduce((sum, week) => sum + (week.topics?.length || 0), 0);
  
  const html = `
<div class="customer-info">
<h2 style="margin:0 0 20px">👤 Customer Profile
<span class="status success">✅ LATEST PLAN</span>
</h2>
<div class="info-grid">
<div class="info-item">
<div class="info-label">Parent Email</div>
<div class="info-value" style="font-size:1.2em">${plan.userEmail}</div>
</div>
<div class="info-item">
<div class="info-label">Parent Name</div>
<div class="info-value" style="font-size:1.2em">${plan.userName}</div>
</div>
<div class="info-item">
<div class="info-label">Child Name</div>
<div class="info-value">${plan.childName}</div>
</div>
<div class="info-item">
<div class="info-label">Age</div>
<div class="info-value">${plan.childAge}</div>
</div>
<div class="info-item">
<div class="info-label">Topics Matched</div>
<div class="info-value">${totalTopics}</div>
</div>
<div class="info-item">
<div class="info-label">Plan Created</div>
<div class="info-value" style="font-size:1.0em">${plan.createdAt.toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'})}</div>
</div>
<div class="info-item" style="grid-column:1/-1">
<div class="info-label">Interests</div>
<div class="info-value" style="font-size:1.2em">${plan.interests.join(', ') || 'N/A'}</div>
</div>
</div>
</div>

<div class="tabs">
<button class="tab active" onclick="window.showTab('summary')">📊 Summary</button>
<button class="tab" onclick="window.showTab('schedule')">📅 Weekly Schedule</button>
<button class="tab" onclick="window.showTab('profile-agent')">📝 Profile Agent</button>
<button class="tab" onclick="window.showTab('match-agent')">🎯 Match Agent</button>
<button class="tab" onclick="window.showTab('schedule-agent')">📅 Schedule Agent</button>
<button class="tab" onclick="window.showTab('reviewer-agent')">✅ Reviewer Agent</button>
<button class="tab" onclick="window.showTab('full-json')">📄 Complete JSON</button>
</div>

<div id="summary" class="tab-content active">
<h2 style="color:#667eea">📊 Execution Summary</h2>
<div class="metric">Total Weeks: ${weeks.length}</div>
<div class="metric">Total Topics: ${totalTopics}</div>
<div class="metric">Plan Type: ${planData.plan_type || 'hybrid'}</div>
<div class="section">
<h3>✅ Plan Generated Successfully</h3>
<p>Customer received a personalized ${weeks.length}-week learning plan with ${totalTopics} topics.</p>
<p><strong>Plan ID:</strong> ${plan.planId}</p>
<p><strong>User ID:</strong> ${plan.userId}</p>
<p><strong>Child ID:</strong> ${plan.childId}</p>
</div>
</div>

<div id="schedule" class="tab-content">
<h2 style="color:#667eea">📅 Weekly Learning Schedule</h2>
${weeks.map((week, idx) => `
<div class="week-block">
<div class="week-header">Week ${idx + 1}</div>
${(week.topics || []).map((topic, topicIdx) => `
<div class="topic-card">
<div class="topic-title">${topicIdx + 1}. ${topic.topic_title || topic.title || 'Untitled'}</div>
<div class="topic-meta">
📚 Category: ${topic.category || 'N/A'} | 
👥 Age Group: ${topic.age_group || 'N/A'} | 
⚡ Difficulty: ${topic.difficulty_level || 'N/A'}
</div>
</div>
`).join('')}
</div>
`).join('')}
</div>

<div id="profile-agent" class="tab-content">
<h2 style="color:#667eea">📝 Profile Agent Output</h2>
<div class="json-viewer">
<pre>${JSON.stringify(planData.profile_output || planData.profile || {}, null, 2)}</pre>
</div>
</div>

<div id="match-agent" class="tab-content">
<h2 style="color:#667eea">🎯 Match Agent Output</h2>
<div class="json-viewer">
<pre>${JSON.stringify(planData.matched_topics || planData.matches || {}, null, 2)}</pre>
</div>
</div>

<div id="schedule-agent" class="tab-content">
<h2 style="color:#667eea">📅 Schedule Agent Output</h2>
<div class="json-viewer">
<pre>${JSON.stringify(planData.schedule || planData.final_schedule || {}, null, 2)}</pre>
</div>
</div>

<div id="reviewer-agent" class="tab-content">
<h2 style="color:#667eea">✅ Reviewer Agent Output</h2>
<div class="json-viewer">
<pre>${JSON.stringify(planData.review || planData.reviewer_output || {}, null, 2)}</pre>
</div>
</div>

<div id="full-json" class="tab-content">
<h2 style="color:#667eea">📄 Complete Plan JSON</h2>
<div class="json-viewer">
<pre>${JSON.stringify(planData, null, 2)}</pre>
</div>
</div>
`;
  
  document.getElementById('content').innerHTML = html;
}

function showError(message) {
  document.getElementById('content').innerHTML = `
    <div class="error">
      ❌ ${message}
    </div>
  `;
}

// Make functions globally available
window.loadLatestPlan = loadLatestPlan;

window.showTab = function(tabName) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  
  // Show selected tab
  document.getElementById(tabName).classList.add('active');
  event.target.classList.add('active');
};

window.copyAllData = function() {
  if (latestData) {
    const text = JSON.stringify(latestData, null, 2);
    navigator.clipboard.writeText(text).then(() => {
      alert('✅ All data copied to clipboard!');
    });
  } else {
    alert('❌ No data to copy');
  }
};

window.toggleAutoRefresh = function() {
  if (autoRefreshInterval) {
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = null;
    document.getElementById('autoRefreshStatus').textContent = 'OFF';
    document.getElementById('autoRefreshStatus').style.color = '#fff';
  } else {
    autoRefreshInterval = setInterval(loadLatestPlan, 30000); // Refresh every 30 seconds
    document.getElementById('autoRefreshStatus').textContent = 'ON (30s)';
    document.getElementById('autoRefreshStatus').style.color = '#4caf50';
  }
};

// Load on page load
loadLatestPlan();
</script>
</body>
</html>
