name: 🖥️ Deploy Backend to Cloud Run

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**' ]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: unschooling-464413
        
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Install Backend Dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: 🏗️ Build and Deploy to Cloud Run
      run: |
        cd backend
        gcloud run deploy unschooling-backend \
          --source . \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --max-instances 10 \
          --port 8000
          
    - name: ✅ Backend Deployment Success
      run: |
        echo "🎉 Backend deployment completed!"
        echo "🖥️ Backend URL: https://unschooling-backend-xxxxxxxxx-uc.a.run.app"
        echo "📅 Deployed at: $(date)"

